PgRuleTypeDMLConvention = "DML Convention"
PgRuleTypeDDLConvention = "DDL Convention"
PgRuleTypeDQLConvention = "DQL Convention"
PgRuleTypeSuggestion = "Usage Suggestion"
PgRuleTypeNamingConvention = "Naming Convention"
PgRuleTypeGlobalConfig = "Global Configuration"
PgRuleTypeIndexOptimization = "Index Optimization"
PgRuleTypeIndexConvention = "Index Convention"
PgRule001Desc = "Avoid using SELECT *"
PgRule001Annotation = "SELECT * affects parsing efficiency, and when table structure changes, SQL data processing may not match the changes, leading to results inconsistent with business expectations"
PgRule001Message = "Avoid using SELECT *"
PgRule002Desc = "DELETE and UPDATE statements must include WHERE clause"
PgRule002Annotation = "UPDATE and DELETE statements without WHERE clause risk accidentally updating or deleting all data in the table"
PgRule002Message = "DELETE and UPDATE statements must include WHERE clause"
PgRule003Desc = "Avoid using HAVING clause"
PgRule003Annotation = "HAVING only filters the result set after retrieving all records, which requires sorting and aggregation operations. Use WHERE clause to limit the number of records and reduce overhead"
PgRule003Message = "Avoid using HAVING clause"
PgRule004Desc = "Prohibit DROP operations except for indexes"
PgRule004Annotation = "It is recommended to backup data and confirm with the business before executing DROP operations to prevent accidental operations"
PgRule004Message = "Prohibit DROP operations except for indexes"
PgRule005Desc = "Prohibit using views"
PgRule005Annotation = "Views have poor query performance, and any changes to the base table structure require view maintenance. If a view has poor readability and contains complex logic, maintenance costs will increase"
PgRule005Message = "Prohibit using views"
PgRule006Desc = "Prohibit using triggers"
PgRule006Annotation = "Triggers are difficult to develop and maintain, cannot be efficiently ported, and in complex logic with high concurrency, are prone to deadlocks affecting business"
PgRule006Message = "Prohibit using triggers"
PgRule007Desc = "Tables should have a primary key"
PgRule007Annotation = "Primary keys are beneficial for data maintenance and can improve SQL execution efficiency"
PgRule007Message = "Tables should have a primary key"
PgRule008Desc = "Tables should not use foreign keys"
PgRule008Annotation = "Foreign keys have poor performance in high-concurrency scenarios, are prone to deadlocks, and are not conducive to later maintenance (splitting, migration)"
PgRule008Message = "Tables should not use foreign keys"
PgRule009Desc = "Tables should not have too many columns"
PgRule009Annotation = "Excessively wide tables cause significant data redundancy and greatly impact performance later"
PgRule009Message = "Tables should not exceed %d columns, currently has %d"
PgRule009Params1 = "Maximum column count"
PgRule010Desc = "Single SQL statement should not be too long"
PgRule010Annotation = "Overly long SQL has poor readability, is difficult to maintain, and can easily cause performance issues"
PgRule010Message = "Single SQL statement should not be too long, length exceeds %d"
PgRule010Params1 = "SQL length"
PgRule011Desc = "Composite index column count should not exceed threshold"
PgRule011Annotation = "Composite indexes create corresponding combination indexes based on the number of index columns. The more columns, the more indexes created, each increasing disk space overhead and index maintenance overhead. It is recommended not to exceed 3"
PgRule011Message = "Composite index column count should not exceed %v"
PgRule011Params1 = "Maximum index column count"
PgRule012Desc = "Regular indexes must use a fixed prefix"
PgRule012Annotation = "Unified naming conventions are beneficial for later maintenance and business development"
PgRule012Message = "Regular indexes must use \"%v\" as prefix"
PgRule012Params1 = "Index prefix"
PgRule015Desc = "Prohibit using keywords for database object names"
PgRule015Annotation = "To avoid conflicts and confusion"
PgRule015Message = "Prohibit using keywords for database object names, involved keywords: %s"
PgRule016Desc = "Prohibit left fuzzy queries"
PgRule016Annotation = "Left fuzzy queries like '%abc' will prevent SQL from using indexes"
PgRule016Message = "Prohibit left fuzzy queries, involved fields: %s"
PgRule017Desc = "Scan rows should not exceed specified limit (default: 10000)"
PgRule017Annotation = "The more rows scanned, the lower the SQL execution efficiency. Default: 10000"
PgRule017Message = "Full table scan detected, scan rows must not exceed %v"
PgRule017Params1 = "Maximum scan rows"
PgRule019Desc = "FROM clause contains multi-level nesting"
PgRule019Annotation = "The deeper the nesting, the more rows to scan and the larger the result set, leading to lower SQL execution efficiency"
PgRule019Message = "FROM clause contains multi-level nesting, exceeds threshold %d. Current SQL nesting level: %d"
PgRule019Params1 = "Maximum nesting levels"
PgRule021Desc = "Avoid using SELECT FOR UPDATE"
PgRule021Annotation = "SELECT FOR UPDATE adds an exclusive lock to each row in the query result set, blocking update and delete operations from other threads. In high concurrency, this can cause a large number of lock waits and affect database query performance"
PgRule021Message = "Avoid using SELECT FOR UPDATE"
PgRule022Desc = "Tables should have comments"
PgRule022Annotation = "Adding comments to tables makes their purpose clearer and facilitates future maintenance"
PgRule022Message = "Please add comments to these tables: %v"
PgRule023Desc = "Columns should have comments"
PgRule023Annotation = "Adding comments to columns makes their purpose clearer and facilitates future maintenance"
PgRule023Message = "Please add comments to columns of table (%v): %v"
PgRule024Desc = "Do not rollback when estimated affected rows exceed specified value in DML"
PgRule024Annotation = "Rolling back large transactions can easily affect database performance and cause business fluctuations. The threshold can be adjusted according to business needs. Default: 1000"
PgRule024Params1 = "Rollback affected rows limit"
PgRule025Desc = "Enable SQL statement rollback feature"
PgRule025Annotation = "Rollback statements can recover from erroneous SQL execution and provide a fault tolerance mechanism"
PgRule026Desc = "Not recommended to modify column data type"
PgRule026Annotation = "Not recommended to modify column data type"
PgRule026Message = "Not recommended to modify column data type"
PgRule027Desc = "INSERT statement does not specify column information"
PgRule027Annotation = "When INSERT does not specify specific columns, adding fields to the table may cause SQL errors"
PgRule027Message = "INSERT statement does not specify column information"
PgRule028Desc = "Execution plan contains Cartesian product, check table join conditions"
PgRule028Annotation = "The execution plan shows a Cartesian product, indicating that the SQL may be missing join conditions, meaning SQL execution efficiency is very low and can easily affect database performance."
PgRule028Message = "Execution plan contains Cartesian product, check table join conditions"
PgRule031Desc = "Not recommended to create redundant indexes"
PgRule031Annotation = "Redundant indexes waste storage space, increase data modification overhead, and may reduce query performance"
PgRule031Message = "Not recommended to create redundant indexes"
PgRule032Desc = "Prohibit SQL without WHERE clause or with WHERE clause always TRUE"
PgRule032Annotation = "SQL without WHERE clause will perform full table scan causing extra overhead. It is recommended to enable this in high-concurrency, large-data environments to avoid impacting database query performance"
PgRule032Message = "Prohibit SQL without WHERE clause or with WHERE clause always TRUE"
PgRule033Desc = "Not recommended to use scalar subqueries"
PgRule033Annotation = "Scalar subqueries affect performance with large data volumes"
PgRule033Message = "Not recommended to use scalar subqueries"
PgRule034Desc = "Not recommended to use OR conditions on multiple fields"
PgRule034Annotation = "Using OR conditions on multiple fields may prevent SQL from using the correct indexes"
PgRule034Message = "Not recommended to use OR conditions on multiple fields"
PgRule035Desc = "Each object name must be prefixed with its owner"
PgRule035Annotation = "According to development standards, each object name must be prefixed with its owner."
PgRule035Message = "Each object name must be prefixed with its owner"
PgRule036Desc = "Not recommended to drop objects"
PgRule036Annotation = "Dropping objects carries risks"
PgRule036Message = "Not recommended to drop objects"
PgRule037Desc = "Not recommended to drop columns"
PgRule037Annotation = "The statement contains a drop column operation, which carries certain risks"
PgRule037Message = "Not recommended to drop columns"
PgRule038Desc = "Not recommended to use UNION in queries"
PgRule038Annotation = "UNION requires sorting and deduplication, which may affect performance"
PgRule038Message = "Not recommended to use UNION in queries"
PgRule039Desc = "Index fields per table should not exceed threshold"
PgRule039Annotation = "Too many indexes cause extra storage overhead, degrade update and delete performance, and increase database maintenance costs. The threshold can be adjusted according to business needs."
PgRule039Message = "Index fields per table should not exceed threshold %v"
PgRule039Params1 = "Maximum index field count"
PgRule040Desc = "Primary key should use auto-increment"
PgRule040Annotation = "Auto-increment primary keys can improve query efficiency and reduce storage space usage"
PgRule040Message = "Primary key should use auto-increment"
PgRule041Desc = "Table join count should not exceed threshold"
PgRule041Annotation = "The more table associations, the more combinations of driving relationships, the higher the cost of comparing various result sets, and SQL query performance will decline significantly. The threshold can be adjusted according to business needs."
PgRule041Message = "Table join count should not exceed threshold %d"
PgRule041Params1 = "Maximum number of joined tables, default: 3"
PgRule042Desc = "Prohibit using functions or expressions on indexed columns in WHERE clause"
PgRule042Annotation = "Using functions or expressions on indexed columns in SQL statements will prevent index usage, causing unreasonable consumption of database resources and affecting business stability."
PgRule042Message = "Prohibit using functions or expressions on indexed columns in WHERE clause"
PgRule043Desc = "Not recommended to use expressions on query columns"
PgRule043Annotation = "Using expressions on query condition columns in SQL statements may prevent index usage, causing unreasonable consumption of database resources and affecting business stability."
PgRule043Message = "Not recommended to use expressions on query columns"
PgRule044Desc = "In multi-table joins, not recommended to use OR conditions on fields from different tables in WHERE clause"
PgRule044Annotation = "In multi-table joins, using OR conditions on fields from different tables in WHERE clause may prevent SQL from using the correct indexes"
PgRule044Message = "In multi-table joins, not recommended to use OR conditions on fields from different tables in WHERE clause"
PgRule045Desc = "Not recommended to use full table scan"
PgRule045Annotation = "Full table scans in SQL execution plans cause unreasonable consumption of database resources and affect business stability."
PgRule045Message = "Not recommended to use full table scan"
PgRule047Desc = "Not recommended to use negative queries"
PgRule047Annotation = "Using !=, <>, NOT IN, NOT EXISTS, NOT LIKE and NOT in WHERE conditions makes logic complex, error-prone, and may prevent index usage."
PgRule047Message = "Not recommended to use negative queries"
PgRule048Desc = "CREATE TABLE DDL must include creation timestamp field of type TIMESTAMP"
PgRule048Annotation = "Recording data creation time is beneficial for problem tracking, data retrieval, and avoids difficulties in data lifecycle management"
PgRule048Message = "CREATE TABLE DDL must include creation timestamp field of type TIMESTAMP"
PgRule048Params1 = "Field name configurable, default: created_time"
PgRule049Desc = "CREATE TABLE DDL must include update timestamp field of type TIMESTAMP"
PgRule049Annotation = "Recording data creation time is beneficial for problem tracking, data retrieval, and avoids difficulties in data lifecycle management"
PgRule049Message = "CREATE TABLE DDL must include update timestamp field of type TIMESTAMP"
PgRule049Params1 = "Field name configurable, default: modified_time"
PgRule050Desc = "Object name character count should not exceed threshold"
PgRule050Annotation = "This rule can standardize object naming length for specified business. The length can be customized. Default maximum length: 63 characters."
PgRule050Message = "Object name character count should not exceed threshold %v"
PgRule050Params1 = "Maximum character count configurable, default 63. Checks: tables, indexes, functions, views, sequences, columns, etc."
PgRule051Desc = "Foreign key fields must have indexes"
PgRule051Annotation = "Foreign key indexes can speed up queries related to foreign keys."
PgRule051Message = "Foreign key fields must have indexes"
PgRule052Desc = "Index field selectivity should be greater than threshold"
PgRule052Annotation = "Choosing fields with high selectivity as indexes can quickly locate data. Too low selectivity cannot effectively utilize indexes and may require scanning a large number of data pages, slowing down SQL. The threshold can be adjusted according to business needs. Default: 70"
PgRule052Message = "Index field selectivity should be greater than threshold %v%%"
PgRule052Params1 = "Minimum selectivity (percentage)"
PgRule053Desc = "Leftmost field of index must appear in query conditions"
PgRule053Annotation = "When query conditions include the leftmost field of an index, the query will maximize the use of index ordering to improve query performance."
PgRule053Message = "Leftmost field of index must appear in query conditions"
PgRule054Desc = "Database object names must only contain lowercase letters, underscores, and digits, and cannot start with a digit"
PgRule054Annotation = "This rule can standardize data object naming rules for specified business"
PgRule054Message = "Database object names must only contain lowercase letters, underscores, and digits, and cannot start with a digit"
PgRule055Desc = "Bound variable count should not exceed threshold"
PgRule055Annotation = "Excessive use of bound variables increases query complexity, thereby reducing query performance. It also increases maintenance costs. Default threshold: 10000"
PgRule055Message = "Bound variable count should not exceed threshold %v"
PgRule055Params1 = "Maximum bound variable count configurable, default: 100"
PgRule056Desc = "Temporary tables must use a fixed prefix"
PgRule056Annotation = "Unified naming conventions are beneficial for later maintenance and business development. Checks CREATE TEMPORARY TABLE statements"
PgRule056Message = "Temporary tables must use fixed prefix %v"
PgRule056Params1 = "Prefix configurable, default: tmp_"
PgRule057Desc = "Keywords and reserved words in SQL must not use mixed case"
PgRule057Annotation = "Mixed case writing reduces code readability and makes maintenance difficult, leading to misunderstanding or incorrect identification."
PgRule057Message = "Keywords and reserved words in SQL must not use mixed case"
PgRule059Desc = "JOIN fields must have consistent types"
PgRule059Annotation = "Inconsistent JOIN field types cause implicit type conversion. Enable this rule to avoid index invalidation"
PgRule059Message = "JOIN fields must have consistent types"
PgRule060Desc = "Prohibit using user-defined functions"
PgRule060Annotation = "User-defined functions are poorly maintainable, and high dependency prevents SQL from being used across databases"
PgRule060Message = "Prohibit using user-defined functions"
PgRule061Desc = "Prohibit using stored procedures"
PgRule061Annotation = "Stored procedures make programs difficult to debug and extend. Different database stored procedure syntaxes vary greatly, causing significant difficulties for future database migration and greatly increasing the probability of bugs"
PgRule061Message = "Prohibit using stored procedures"
PgRule062Desc = "Index count per table should not exceed threshold"
PgRule062Annotation = "Each index on a table increases storage overhead and processing overhead for insert, delete, and update operations. Too many or insufficient or incorrect indexes are not beneficial for performance. The threshold can be adjusted according to business needs. Default: 5"
PgRule062Message = "Index count per table should not exceed threshold %v"
PgRule062Params1 = "Maximum index count, configurable, default: 5"
PgRule063Desc = "Index fields must have NOT NULL constraint"
PgRule063Annotation = "Without NOT NULL constraint on index fields, table records and index records will not completely map."
PgRule063Message = "Index fields must have NOT NULL constraint"
PgRule064Desc = "Index count on a single field should not exceed threshold"
PgRule064Annotation = "Too many indexes on a single field generally have no value. On the contrary, they will reduce the performance of data addition and deletion, especially for frequently updated tables. The threshold can be adjusted according to business needs. Default: 2"
PgRule064Message = "Index count on a single field should not exceed threshold %v"
PgRule064Params1 = "Single field index count threshold, default: 2"
PgRule065Desc = "Avoid using offset in pagination queries"
PgRule065Annotation = "When the offset is large, query efficiency is very low, e.g., LIMIT N OFFSET M or OFFSET M LIMIT N. Due to heavy index traversal, cursor positioning, and pagination calculation operations. For PostgreSQL tables with large data volumes, OFFSET pagination has serious performance issues"
PgRule065Message = "Avoid using offset in pagination queries"
PgRule066Desc = "Database object names should not use mixed case"
PgRule066Annotation = "Database object naming convention: mixed case is not recommended. Use underscores to connect words to improve code readability"
PgRule066Message = "Database object names should not use mixed case"
PgRule067Desc = "UNIQUE indexes must use a fixed prefix"
PgRule067Annotation = "This rule can standardize UNIQUE index naming rules for specified business. The naming convention can be customized. Default prefix: uniq_"
PgRule067Message = "UNIQUE indexes must use fixed prefix %v"
PgRule067Params1 = "Prefix configurable, default: uniq_"
PgRule068Desc = "Single INSERT statement batch insert should not exceed threshold"
PgRule068Annotation = "Avoid large transactions and reduce the impact of rollback on business. The threshold can be adjusted according to business needs. Default: 100"
PgRule068Message = "Single INSERT statement batch insert should not exceed threshold %v"
PgRule068Params1 = "Maximum INSERT rows per statement, default: 100"
PgRule069Desc = "Not recommended to perform full index scan"
PgRule069Annotation = "Full index scans with large data volumes severely impact SQL performance."
PgRule069Message = "Not recommended to perform full index scan"
PgRule070Desc = "Parameter count in IN clause of WHERE condition must not exceed threshold"
PgRule070Annotation = "When there are too many IN values, it may cause full table scan and sharply degrade PostgreSQL performance. The threshold can be adjusted according to business needs. Default: 50"
PgRule070Message = "Parameter count in IN clause of WHERE condition must not exceed threshold %v"
PgRule070Params1 = "IN clause parameter count threshold, default: 50"
PgRule071Desc = "Recommend using UNION ALL instead of UNION"
PgRule071Annotation = "UNION sorts and deduplicates by field order, while UNION ALL simply merges two result sets and returns. In terms of efficiency, UNION ALL is much faster than UNION. If the merged result sets allow duplicate data and do not need sorting, enable this rule to use UNION ALL instead of UNION"
PgRule071Message = "Recommend using UNION ALL instead of UNION"
PgRule072Desc = "Avoid using unnecessary built-in functions"
PgRule072Annotation = "This rule can specify built-in functions that should be prohibited in business. Using built-in functions may prevent SQL from using indexes or produce unexpected results. Functions to disable can be configured. Default set: sha1(), sha256(), sqrt(), md5()"
PgRule072Message = "Avoid using unnecessary built-in functions %v"
PgRule072Params1 = "Specified function set (comma separated)"
PgRule073Desc = "JOIN table query count should not exceed threshold"
PgRule073Annotation = "The more table associations, the more combinations of driving relationships, the higher the cost of comparing various result sets, and SQL query performance will decline significantly. The threshold can be adjusted according to business needs. Default: 3"
PgRule073Message = "JOIN table query count should not exceed threshold %v"
PgRule073Params1 = "Maximum join table count"
PgRule074Desc = "Prohibit sorting on long fields"
PgRule074Annotation = "ORDER BY, DISTINCT, GROUP BY, UNION operations on long fields such as VARCHAR(2000) will cause sorting with performance risks. Default: 2000"
PgRule074Message = "Prohibit sorting on long fields"
PgRule074Params1 = "Long field length configurable, default: 2000"
PgRule075Desc = "SELECT statements must limit query result rows"
PgRule075Annotation = "If the scan rows are very large, the optimizer may choose the wrong index or not use an index at all. The threshold can be adjusted according to business needs. Default: 1000"
PgRule075Message = "SELECT statements must limit query result rows, default: %v"
PgRule075Params1 = "Maximum query result rows"
PgRule076Desc = "Not recommended to use different sort directions for multiple conditions in ORDER BY"
PgRule076Annotation = "When multiple columns in the ORDER BY clause have inconsistent sort directions, PostgreSQL typically cannot use a single index to satisfy all sorting needs, potentially requiring sorting operations or multiple index merge operations, which affects query performance."
PgRule076Message = "Not recommended to use different sort directions for multiple conditions in ORDER BY"
PgRule077Desc = "Subquery nesting level should not exceed threshold"
PgRule077Annotation = "When subquery nesting levels exceed the threshold, subqueries may not use indexes. For subqueries returning large result sets, a large number of temporary tables will be generated, consuming excessive CPU and IO resources and producing many slow queries. Default: 3"
PgRule077Message = "Subquery nesting level should not exceed threshold %v"
PgRule077Params1 = "Subquery nesting level threshold, default: 3"
PgRule078Desc = "Prohibit using data types inconsistent with filter fields in WHERE conditions"
PgRule078Annotation = "Using data types inconsistent with filter fields in WHERE conditions triggers implicit data type conversion, risking index misses. In high-concurrency, large-data scenarios, not using indexes will severely degrade database query performance"
PgRule078Message = "Prohibit using data types inconsistent with filter fields in WHERE conditions"
PgRule079Desc = "LIMIT queries should use ORDER BY"
PgRule079Annotation = "LIMIT without ORDER BY leads to non-deterministic results that may not meet business requirements, depending on the execution plan"
PgRule079Message = "LIMIT queries should use ORDER BY"
PgRule080Desc = "Uncommitted transaction exists before DDL execution"
PgRule080Annotation = "Check whether there are transactions locking related resources before DDL operations to avoid lock conflicts causing lock waits or deadlock issues"
PgRule080Message = "Uncommitted transaction exists before DDL execution"
PgRule080MessageLock = "Uncommitted transaction exists before DDL execution, %d transactions hold locks in pg_locks, please confirm manually"
PgRule080MessageSchemaLock = "Uncommitted transaction exists before DDL execution, %d transactions hold locks on schema [%s] resources in pg_locks, please confirm manually"
PgRule080MessageTableLock = "Uncommitted transaction exists before DDL execution, %d transactions hold locks on table [%s.%s] in pg_locks"
